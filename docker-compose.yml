services:
  db:
    image: postgres:16-alpine
    container_name: gridlink-db
    environment:
      POSTGRES_USER: gridlink
      POSTGRES_PASSWORD: gridlink
      POSTGRES_DB: gridlink
    ports:
      - "5434:5432"
    volumes:
      - gridlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridlink"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gridlink_pgdata:
